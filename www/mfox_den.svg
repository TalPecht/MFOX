<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">MFOX Fox Den</title>
  <desc id="desc">A minimal fox inside a layered den, using the MFOX wine, rose and warm cream palette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f4"/>
      <stop offset="1" stop-color="#f7dfe4"/>
    </linearGradient>
