name: Discover MFOX candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::rentrez
      - name: Search PubMed into candidate queue
        run: Rscript scripts/discover_pubmed.R
      - name: Validate database after discovery
        run: Rscript scripts/validate_database.R
      - name: Create reviewable candidate pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update MFOX candidate queue"
          title: "Automated MFOX candidate discovery"
          body: |
            Weekly automated discovery only.
            New records are candidates, not curated evidence.
            Review them in the MFOX Curator before promotion.
          branch: "automation/mfox-candidates"
          delete-branch: true
